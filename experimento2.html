<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cecilia Bautista — entrada experimental</title>
  <meta name="description" content="Entrada experimental: la obra de Cecilia Bautista armada con partículas de pintura." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

<canvas id="polvo" aria-hidden="true"></canvas>

<div class="entrada">

  <p class="arriba">Artista visual · Ciudad de México</p>

  <div class="hueco" aria-hidden="true"></div>

  <div class="abajo">
    <p class="ficha" id="ficha" aria-live="polite">
      <span class="ficha__titulo">Torito</span>
      <span class="ficha__dato">Óleo sobre lienzo · 2025</span>
    </p>

    <h1 class="nombre" data-split>Cecilia Bautista</h1>

    <p class="pista"><span id="pista">La pintura se deshace si la tocas</span></p>

    <nav class="salidas">
      <a href="/galeria.html">Ver la obra</a>
      <a href="https://wa.me/525525228756" target="_blank" rel="noopener">WhatsApp</a>
      <a href="/">Sitio normal</a>
    </nav>
  </div>

</div>

<!-- Respaldo: si no hay WebGL se ve la obra tal cual -->
<noscript>
  <div class="respaldo">
    <img src="/images/experimento/torito.jpg" alt="Torito — óleo de un torito de fuego azul, de Cecilia Bautista" />
  </div>
